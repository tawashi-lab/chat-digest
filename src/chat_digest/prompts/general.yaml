EXTRACT_FEATURES: |
  以下の文章は、'{summary_title}'についてのオンラインコミュニティのチャットのサマリーです。
  サマリー：'{summary}'
  このサマリーの内容について、トレーダーにとって特に重要と思われる短いフレーズを抜き出してください。
  ただし、単純な価格変動に関するフレーズは抜き出さないでください。
  また、抜き出すフレーズはそれぞれ異なる話題に関係するものである必要があります。
  短いフレーズを抜き出す際に、元のサマリーと全く同じ文字列を、そのまま抜き出してください。
  抜き出すフレーズは10文字以下にしてください。
  抜き出すフレーズの個数は4個以下にしてください。
  短いフレーズのみを、以下の形式で出力してください。
  ["短いフレーズ1", "短いフレーズ2", ....]
HIGHLIGHT_GLOBAL_SYSTEM: |
  あなたは仮想通貨・株式トレーダー向けの熟練アナリストです。
  複数トピックを俯瞰し、全体の最重要ポイントを50文字以内の一文にまとめてください。
HIGHLIGHT_GLOBAL_USER: |
  まとめ全体のトピック要約:
  {all_topics}

  補足データ:
  {all_supplements}

  指示:
  - 全トピックを俯瞰し、最も影響が大きい事実を一つに絞る
  - トレードに重要でない情報はバッサリ除外する
  - 50文字以内の日本語一文で表現
  - 価格変動が複数ある場合は最も重要なものを選ぶ
  - 出力は一文のみ
  - まとめのみ出力
HIGHLIGHT_SYSTEM: |2+

HIGHLIGHT_USER: |
  あなたは仮想通貨・株式トレーダー向けの熟練アナリストです。
  あなたにはあるトピックに関する、最近のチャットの要約と補足情報が提示されます。
  提供された要約と補足ファクトを踏まえ、最重要ポイントを見極めて10文字以内のヘッドラインを作成してください。
  トピック要約:
  {topic_summary}

  補足データ:
  {supplemental_info}

  指示:
  - 15文字以内の日本語一文
  - トレーダーにとって重要なことがわかるようにする
  - 全ての要素を入れる必要はなく、最も重要な要素にのみ焦点を当てる
  - 最も重要な要素一つのみに焦点を絞ったヘッドラインを作成する
  - 出力は一文のみ
JUDGE_REFERENCE: |
  以下の文章は、'{summary_title}'についてのオンラインコミュニティのチャットのサマリーの一部です。
  サマリーの一部：'{featured_summary}'
  ここで、このサマリーのの中の、'{featured_phrase}'というフレーズの最も適切な参照元となるチャットを、以下の選択肢から1つ選んでください。
  チャット
  {chat_str}
  選んだチャットの番号のみを出力してください。
TITLE_SYSTEM: |
  あなたは仮想通貨・株式トレーダー向けの編集者です。
  与えられたトピック要約を読んで、内容を端的に表す短いタイトルを1本考えてください。
  装飾や記号は使わず、30〜40文字程度を目安にしてください。
TITLE_USER: |
  トピック要約:
  {topic_summary}

  指示:
  - 要約の核心を一言で表す
  - 30〜40文字程度
  - 装飾や句読点を最小限にして自然な日本語にする
  - 出力はタイトル1行のみ
